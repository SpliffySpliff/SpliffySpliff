<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <style>
    .title{font-size:16px;font-weight:600;fill:#111}
    .sub{font-size:12px;fill:#555}
    .axis{stroke:#444;stroke-width:1}
    .or{fill:#fff3cd;stroke:#b08900;stroke-width:1}
    .candle-up{fill:#2a9d8f;stroke:#1d6e63}
    .candle-down{fill:#e76f51;stroke:#a13d24}
    .lvl{stroke:#1f4e8a;stroke-width:1.2;stroke-dasharray:4 3;fill:none}
    .stop{stroke:#c1121f;stroke-width:1.4;stroke-dasharray:6 3;fill:none}
    .target{stroke:#2a9d8f;stroke-width:1.4;stroke-dasharray:6 3;fill:none}
    .lbl{font-size:11px;fill:#111}
    .lbl-b{font-size:11px;font-weight:600;fill:#111}
  </style>
  <rect width="720" height="440" fill="#fff"/>
  <text class="title" x="20" y="28">Opening Range Breakout (ORB) — Schema</text>
  <text class="sub" x="20" y="46">ORB-15min beim Cash-Open. Long bei Bruch von OR-High mit CVD-Bestätigung. Stop unter OR-Low, Ziel 1R/2R.</text>

  <!-- Chart frame -->
  <line class="axis" x1="60" y1="80" x2="60" y2="380"/>
  <line class="axis" x1="60" y1="380" x2="700" y2="380"/>
  <text class="lbl" x="20" y="90">Preis</text>
  <text class="lbl" x="60" y="400">09:30</text>
  <text class="lbl" x="160" y="400">09:45</text>
  <text class="lbl" x="280" y="400">10:00</text>
  <text class="lbl" x="400" y="400">10:30</text>
  <text class="lbl" x="540" y="400">11:00</text>
  <text class="lbl" x="660" y="400">11:30</text>

  <!-- Opening Range box -->
  <rect class="or" x="60" y="200" width="100" height="80"/>
  <text class="lbl-b" x="110" y="195" text-anchor="middle">Opening Range</text>
  <text class="lbl" x="110" y="295" text-anchor="middle">(15 min)</text>

  <!-- ORH / ORL lines -->
  <line class="lvl" x1="60" y1="200" x2="700" y2="200"/>
  <text class="lbl-b" x="680" y="195" text-anchor="end" fill="#1f4e8a">OR-High</text>
  <line class="lvl" x1="60" y1="280" x2="700" y2="280"/>
  <text class="lbl-b" x="680" y="295" text-anchor="end" fill="#1f4e8a">OR-Low</text>

  <!-- Stop / Target -->
  <line class="stop" x1="160" y1="290" x2="700" y2="290"/>
  <text class="lbl-b" x="680" y="305" text-anchor="end" fill="#c1121f">Stop</text>
  <line class="target" x1="160" y1="120" x2="700" y2="120"/>
  <text class="lbl-b" x="680" y="115" text-anchor="end" fill="#2a9d8f">Ziel 2R</text>

  <!-- Candles inside OR -->
  <g>
    <line x1="80" y1="210" x2="80" y2="270" stroke="#1d6e63"/><rect class="candle-up" x="74" y="230" width="12" height="30"/>
    <line x1="100" y1="220" x2="100" y2="275" stroke="#a13d24"/><rect class="candle-down" x="94" y="240" width="12" height="25"/>
    <line x1="120" y1="215" x2="120" y2="265" stroke="#1d6e63"/><rect class="candle-up" x="114" y="225" width="12" height="30"/>
    <line x1="140" y1="205" x2="140" y2="270" stroke="#1d6e63"/><rect class="candle-up" x="134" y="215" width="12" height="35"/>
  </g>

  <!-- Breakout candles -->
  <g>
    <line x1="170" y1="195" x2="170" y2="240" stroke="#1d6e63"/><rect class="candle-up" x="164" y="200" width="12" height="30"/>
    <line x1="200" y1="170" x2="200" y2="220" stroke="#1d6e63"/><rect class="candle-up" x="194" y="180" width="12" height="35"/>
    <line x1="230" y1="150" x2="230" y2="200" stroke="#1d6e63"/><rect class="candle-up" x="224" y="160" width="12" height="35"/>
    <line x1="260" y1="135" x2="260" y2="180" stroke="#1d6e63"/><rect class="candle-up" x="254" y="145" width="12" height="30"/>
    <line x1="290" y1="125" x2="290" y2="160" stroke="#1d6e63"/><rect class="candle-up" x="284" y="130" width="12" height="25"/>
    <line x1="320" y1="115" x2="320" y2="145" stroke="#1d6e63"/><rect class="candle-up" x="314" y="118" width="12" height="25"/>
    <text class="lbl-b" x="200" y="245" fill="#2a9d8f">Entry: Bruch OR-High + CVD &gt; 0</text>
  </g>

  <!-- Trail off -->
  <g>
    <line x1="360" y1="120" x2="360" y2="150" stroke="#a13d24"/><rect class="candle-down" x="354" y="125" width="12" height="22"/>
    <line x1="400" y1="115" x2="400" y2="150" stroke="#1d6e63"/><rect class="candle-up" x="394" y="120" width="12" height="28"/>
    <line x1="440" y1="105" x2="440" y2="135" stroke="#1d6e63"/><rect class="candle-up" x="434" y="110" width="12" height="22"/>
    <line x1="480" y1="100" x2="480" y2="130" stroke="#1d6e63"/><rect class="candle-up" x="474" y="105" width="12" height="22"/>
  </g>
</svg>
